name: ReceiptScanner
options:
  bundleIdPrefix: com.swiftextract
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  swift-extract:
    path: ../..

targets:
  ReceiptScanner:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
        excludes:
          - Resources
    resources:
      - path: Sources/Resources/Fixtures
        type: folder
    dependencies:
      - package: swift-extract
        product: Extract
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftextract.ReceiptScanner
        PRODUCT_NAME: ReceiptScanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Receipt Scanner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan receipts and documents for structured extraction."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select receipt photos for structured extraction."
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        ENABLE_PREVIEWS: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Receipt Scanner
        UILaunchScreen: {}
        NSCameraUsageDescription: "Scan receipts and documents for structured extraction."
        NSPhotoLibraryUsageDescription: "Select receipt photos for structured extraction."
        LSApplicationCategoryType: public.app-category.productivity

schemes:
  ReceiptScanner:
    build:
      targets:
        ReceiptScanner: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
