name: ReceiptScanner
options:
  bundleIdPrefix: com.swiftextract
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  # MLX trait enables on-device MLX backends via AnyLanguageModel.
  # mlx-swift-lm is also declared directly as the SPM trait graph workaround
  # (see AnyLanguageModel#135 / swift-package-manager#9286) and so the demo
  # can call MLXLMCommon.downloadModel with progress.
  swift-extract:
    path: ../..
    traits:
      - MLX
  # Pin below 2.31: mlx-swift 0.31.5+ uses swift-tools 6.3 experimentalCGen +
  # a CudaBuild plugin that fails Xcode package validation on Apple platforms.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 2.30.6

targets:
  ReceiptScanner:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
        excludes:
          - Resources
      # Folder reference so fixtures land at `Fixtures/` in the bundle
      # (SampleFixture.url looks them up by that subdirectory).
      - path: Sources/Resources/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: swift-extract
        product: Extract
      - package: mlx-swift-lm
        product: MLXLMCommon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftextract.ReceiptScanner
        PRODUCT_NAME: ReceiptScanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Receipt Scanner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan receipts and documents for structured extraction."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select receipt photos for structured extraction."
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WV9GF23FQM
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        ENABLE_PREVIEWS: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # App-side `#if MLX` gates (ModelSettingsStore) mirror the package trait.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "MLX $(inherited)"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG MLX $(inherited)"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Receipt Scanner
        UILaunchScreen: {}
        NSCameraUsageDescription: "Scan receipts and documents for structured extraction."
        NSPhotoLibraryUsageDescription: "Select receipt photos for structured extraction."
        LSApplicationCategoryType: public.app-category.productivity

schemes:
  ReceiptScanner:
    build:
      targets:
        ReceiptScanner: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
