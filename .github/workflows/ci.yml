name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test (offline)
        env:
          # Ensure no accidental network model calls
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          EXTRACT_USE_MOCK: "1"
        run: swift test

      - name: CLI extract (mock, twice)
        env:
          EXTRACT_USE_MOCK: "1"
        run: |
          swift run extract-cli fixtures/invoice.pdf --schema Examples/schemas/Invoice.swift --mock | tee /tmp/cli1.json
          swift run extract-cli fixtures/invoice.pdf --schema Examples/schemas/Invoice.swift --mock | tee /tmp/cli2.json
          python3 -c "import json; a=json.load(open('/tmp/cli1.json')); b=json.load(open('/tmp/cli2.json')); assert a==b; assert a['vendor']=='Acme Supplies Co.'"

      - name: swift-format lint
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            swift-format lint --configuration .swift-format --recursive Sources Tests || true
          elif command -v swift >/dev/null 2>&1 && swift format --help >/dev/null 2>&1; then
            swift format lint --configuration .swift-format --recursive Sources Tests || true
          else
            echo "swift-format not installed; skipping lint"
          fi

  demo-macos:
    name: Demo app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build ReceiptScanner
        working-directory: Examples/ReceiptScanner
        run: swift build -v
