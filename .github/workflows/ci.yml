name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test (offline)
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          EXTRACT_USE_MOCK: "1"
        # --no-parallel: the ingest path calls Vision synchronously from async code, so
        # parallel tests block the Swift cooperative pool and Vision's own capacity-limited
        # queue, wedging the run forever (this job was cancelled on timeout for 0.7.0).
        # Serial is 5s. Remove once OCR/raster work runs off the cooperative pool.
        run: swift test --no-parallel

      - name: CLI extract (mock, twice)
        env:
          EXTRACT_USE_MOCK: "1"
        run: |
          swift run extract-cli fixtures/invoice.pdf --schema Examples/schemas/Invoice.swift --mock | tee /tmp/cli1.json
          swift run extract-cli fixtures/invoice.pdf --schema Examples/schemas/Invoice.swift --mock | tee /tmp/cli2.json
          python3 -c "import json; a=json.load(open('/tmp/cli1.json')); b=json.load(open('/tmp/cli2.json')); assert a==b; assert a['vendor']=='Acme Supplies Co.'"

      - name: Install swift-format
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            echo "swift-format already installed: $(swift-format --version || true)"
          elif swift format --help >/dev/null 2>&1; then
            echo "using built-in: swift format"
          else
            brew install swift-format
          fi

      - name: swift-format lint
        run: |
          set -euo pipefail
          if command -v swift-format >/dev/null 2>&1; then
            swift-format lint --strict --configuration .swift-format --recursive Sources Tests
          elif swift format --help >/dev/null 2>&1; then
            # Xcode-bundled formatter (Swift 6+)
            swift format lint --configuration .swift-format --recursive Sources Tests
          else
            echo "error: swift-format is required for CI and is not available" >&2
            exit 1
          fi

  # Hermetic harness: fixtures + mock only. Keeps measurement code from rotting.
  # Does not download the private corpus or enable MLX.
  eval-harness:
    name: Eval harness (fixtures, mock)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build eval harness
        working-directory: Tools/EvalHarness
        run: swift build

      - name: Survey + accuracy over fixtures (mock, anchors)
        working-directory: Tools/EvalHarness
        run: |
          set -euo pipefail
          swift run extract-eval --mode survey \
            --repo-root ../.. \
            --fixtures ../../fixtures \
            --backend mock \
            --output /tmp/eval-survey
          swift run extract-eval --mode accuracy \
            --repo-root ../.. \
            --fixtures ../../fixtures \
            --backend mock \
            --output /tmp/eval-accuracy
          test -f /tmp/eval-survey/survey.md
          test -f /tmp/eval-survey/anchors.md
          test -f /tmp/eval-accuracy/accuracy.md
          test -f /tmp/eval-accuracy/anchors.md
