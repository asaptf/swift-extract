name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test (offline)
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          EXTRACT_USE_MOCK: "1"
        run: swift test

      - name: CLI extract (mock, twice)
        env:
          EXTRACT_USE_MOCK: "1"
        run: |
          swift run extract-cli fixtures/invoice.pdf --schema Examples/schemas/Invoice.swift --mock | tee /tmp/cli1.json
          swift run extract-cli fixtures/invoice.pdf --schema Examples/schemas/Invoice.swift --mock | tee /tmp/cli2.json
          python3 -c "import json; a=json.load(open('/tmp/cli1.json')); b=json.load(open('/tmp/cli2.json')); assert a==b; assert a['vendor']=='Acme Supplies Co.'"

      - name: Install swift-format
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            echo "swift-format already installed: $(swift-format --version || true)"
          elif swift format --help >/dev/null 2>&1; then
            echo "using built-in: swift format"
          else
            brew install swift-format
          fi

      - name: swift-format lint
        run: |
          set -euo pipefail
          if command -v swift-format >/dev/null 2>&1; then
            swift-format lint --strict --configuration .swift-format --recursive Sources Tests
          elif swift format --help >/dev/null 2>&1; then
            # Xcode-bundled formatter (Swift 6+)
            swift format lint --configuration .swift-format --recursive Sources Tests
          else
            echo "error: swift-format is required for CI and is not available" >&2
            exit 1
          fi

  demo-macos:
    name: Demo app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # SPM graph without MLX (Package.swift). Validates demo sources on SDK 15 /
      # Xcode 16 where FoundationModels is absent — Apple Intelligence paths must
      # compile out cleanly via canImport(FoundationModels).
      - name: Build ReceiptScanner (SPM)
        working-directory: Examples/ReceiptScanner
        run: swift build -v

      # Full Xcode project enables the MLX package trait (mlx-swift native build).
      # That stack is too heavy / flaky on GitHub Actions (submodules, long Metal
      # compile). Validate the project file still exists and schemes resolve;
      # device/MLX builds are expected locally via ReceiptScanner.xcodeproj.
      - name: Validate ReceiptScanner.xcodeproj schemes
        working-directory: Examples/ReceiptScanner
        run: |
          set -euo pipefail
          test -f ReceiptScanner.xcodeproj/project.pbxproj
          xcodebuild -project ReceiptScanner.xcodeproj -list
